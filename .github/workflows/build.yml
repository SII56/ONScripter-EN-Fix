name: build

on: [push, pull_request]

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: build
      run: ./build-macos.sh

    - name: smoke test
      run: |
        ./onscripter-en --version
        ./onscripter-en --help | head -3

    - uses: actions/upload-artifact@v4
      with:
        name: onscripter-en.macOS.arm64
        path: onscripter-en
